<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template Register — Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <h1>Template Register</h1>
    <a class="btn ghost" href="admin.html">Admin</a>
  </div>
</header>

<main class="wrap">
  <input id="search" class="search" type="search" placeholder="Cari template… (nama / deskripsi)">
  <div id="template-grid" class="grid"></div>
  <p id="empty-state" class="empty" hidden></p>
  <p id="error" class="error" hidden></p>
</main>

<div id="preview-modal" class="modal" hidden>
  <div class="modal-box">
    <button class="modal-close" onclick="closePreview()" aria-label="Tutup">&#10005;</button>
    <iframe id="preview-frame" title="Preview PDF"></iframe>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
