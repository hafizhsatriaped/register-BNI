<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Panduan Format Register BNI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Panel Admin</h1>
    <p class="subtitle">Kelola template register</p>

    <!-- Form login Supabase Auth -->
    <div id="login-section" class="login-section" hidden>
      <div class="field">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" autocomplete="username" placeholder="nama@domain.com">
      </div>
      <div class="field">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" autocomplete="current-password" placeholder="Password admin">
      </div>
      <button id="loginBtn" class="btn btn-primary btn-block">Masuk</button>
      <p id="loginError" class="login-error" style="display:none;"></p>
    </div>

    <!-- Panel admin (hanya tampil setelah login) -->
    <div id="auth-section" style="display:none;">
      <div class="panel-head">
        <span id="sessionEmail" class="session-email"></span>
        <button id="logoutBtn" class="btn btn-secondary">Keluar</button>
      </div>

      <div class="upload-section">
        <h2>Upload Template Baru</h2>
        <p class="info">Pilih satu atau lebih file (max 10, PDF/Excel, max 5 MB per file).</p>

        <input type="file" id="fileInput" accept=".pdf,.xls,.xlsx" multiple style="display:none;">
        <button id="selectFilesBtn" class="btn btn-primary activeable">Pilih File</button>

        <div id="fileListContainer" class="file-list-container" style="display:none;">
          <div class="bulk-desc-control field">
            <label for="bulkDesc">Deskripsi untuk semua (opsional):</label>
            <div class="desc-control-row">
              <input type="text" id="bulkDesc" placeholder="Masukkan deskripsi...">
              <button id="applyBulkDesc" class="btn btn-secondary activeable">Terapkan ke Semua</button>
            </div>
          </div>
          <ul id="fileList" class="file-list"></ul>
          <button id="uploadAllBtn" class="btn btn-primary activeable">Upload Semua</button>
        </div>
      </div>

      <div id="progressSection" class="progress-section" style="display:none;">
        <div class="progress-bar-wrapper">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <p id="progressText">0/0 file</p>
        <div id="progressDetail" class="progress-detail"></div>
      </div>

      <hr>
      <h2>Template Tersedia</h2>
      <div id="templateList" class="template-grid">
        <p>Memuat data...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha256-+95SqrFwCjswgIeueLQftRkuepUtgdXQgjh2POMkXdg=" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="util.js"></script>
  <script src="admin.js"></script>
</body>
</html>
